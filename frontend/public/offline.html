<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MaiPai Home - restarting</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, sans-serif;
        background: #0b0b0f;
        color: #f5f5f7;
        text-align: center;
      }
      main { max-width: 28rem; }
      h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
      p { color: #a1a1aa; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="offline-title">Home is restarting or updating</h1>
      <p id="offline-body" role="status" aria-live="polite">
        It will be back in a minute. This page checks every few seconds and
        opens Home by itself when it answers. If this device is away from your
        home network, reconnect to your home Wi-Fi.
      </p>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
