<!doctype html>
<html lang="en" data-pro-look>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0b0f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/brand/maipai-home-icon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/brand/maipai-home-icon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="192x192" href="/brand/pwa-icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MaiPai" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="application-name" content="MaiPai Home" />
    <meta name="format-detection" content="telephone=no" />
    <script src="/first-paint.js"></script>
    <title>MaiPai Home</title>
    <!-- Shown until the app draws (React replaces #root's contents): a logo and a spinner instead of a white page. Theme tokens only. -->
    <style>
      #root > .first-paint { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; min-height: 100vh; min-height: 100dvh; background: var(--page, var(--background)); }
      .first-paint img { width: 4rem; height: 4rem; border-radius: 1rem; }
      .first-paint .fp-dark { display: none; }
      html.dark .first-paint .fp-light { display: none; }
      html.dark .first-paint .fp-dark { display: block; }
      .first-paint .fp-spin { width: 1.5rem; height: 1.5rem; border-radius: 9999px; border: 2px solid var(--border); border-top-color: var(--muted-foreground); animation: fp-spin 0.9s linear infinite; }
      @keyframes fp-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .first-paint .fp-spin { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="first-paint" role="status" aria-label="Loading MaiPai Home"><img class="fp-light" src="/brand/maipai-home-icon-light.png" alt="" width="64" height="64" /><img class="fp-dark" src="/brand/maipai-home-icon-dark.png" alt="" width="64" height="64" /><div class="fp-spin" aria-hidden="true"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
