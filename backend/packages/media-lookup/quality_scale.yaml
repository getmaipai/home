# Bronze/silver/gold criteria per getmaipai/.github's docs/PACKAGES.md.
# `met: true` on every bronze line is the publish gate; `scripts.sh`'s
# bronze check (spec/tests/ts/package-bronze.test.ts) reads this file,
# not just the manifest's own `quality_scale` string.
package: media-lookup
scale: bronze
bronze:
  tests_green:
    met: true
    note: "deno test (handler_test.ts) passes: parseTitleAndYear, pickCandidate, shapeMediaResult, and composeReply exercised directly, plus handleMedia end to end against recorded fixtures for two films and one TV show, plus the typed not_found and network_unreachable error paths"
  routing_examples:
    met: true
    note: 8 examples in manifest.json's routing.examples
  privacy_row_per_data_source:
    met: true
    note: one data_sources[] row each for wikidata and wikipedia
  offline_behavior_stated:
    met: true
    note: "offline: unavailable - accurate, every lookup needs the network"
  smoke_test:
    met: true
    note: "smoke: { kind: deno_test }, handler_test.ts, run through lib/smoke.ts's runDenoTestSmoke(), the same shape as the knowledge package"
  readme_and_changelog:
    met: true
  lint_clean:
    met: true
    note: "handler.ts/handler_test.ts are Deno-native TypeScript, outside backend's own tsconfig include - deno test itself is this package's own lint/typecheck gate, the same as knowledge's own note"
silver:
  diagnostics_and_reauth:
    met: false
    note: no auth to diagnose (two keyless public APIs); nothing to add for silver yet
gold:
  real_service_verified:
    met: true
    date: "2026-09-13"
    note: built and manually verified end to end against real Wikidata and Wikipedia responses and a real running dev server the same day
