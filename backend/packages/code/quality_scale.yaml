# Bronze criteria per getmaipai/.github's docs/PACKAGES.md.
package: code
scale: bronze
bronze:
  tests_green:
    met: true
    note: Home's backend/tests/codeApp.test.ts covers who sees the app and the tiers a person may run.
  routing_examples:
    met: true
    note: 5 examples in manifest.json's routing.examples
  privacy_row_per_data_source:
    met: true
    note: "data_sources is empty. The app talks only to the hub's own session routes, with no outside requests"
  offline_behavior_stated:
    met: true
    note: "offline: full - sessions run on the hub and the local model, with no internet needed."
  smoke_test:
    met: true
    note: smoke.kind static, the manifest and pages load
  readme_and_changelog:
    met: true
  lint_clean:
    met: true
silver:
  diagnostics_and_reauth:
    met: false
