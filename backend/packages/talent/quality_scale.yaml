# Bronze criteria per getmaipai/.github's docs/PACKAGES.md.
package: talent
scale: bronze
bronze:
  tests_green:
    met: true
    note: Home's backend/tests/talentWriter.test.ts covers the format catalog, the brief, the outline repair, line checks, absences and the minor check; talentSynths and talentLife cover the synths.
  routing_examples:
    met: true
    note: the manifest lists the spoken requests that open a show ("make a news briefing", "write a short narration")
  privacy_row_per_data_source:
    met: true
    note: "data_sources is empty. A show reads the home's own news shelf, weather, lists and the synths' lives; nothing leaves the hub"
  offline_behavior_stated:
    met: true
    note: "offline: full - every word and voice is made on the hub; a news briefing simply uses the stories already fetched"
  smoke_test:
    met: true
    note: smoke.kind static, the manifest and the nine format files load and validate at boot
  readme_and_changelog:
    met: true
  lint_clean:
    met: true
silver:
  diagnostics_and_reauth:
    met: false
