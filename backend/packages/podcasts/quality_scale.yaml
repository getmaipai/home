# Bronze criteria per getmaipai/.github's docs/PACKAGES.md.
package: podcasts
scale: bronze
bronze:
  tests_green:
    met: true
    note: Home's backend/tests/podcasts.test.ts covers the poller hand-off, conditional GET, save, resume, keep rules, child view and OPML.
  routing_examples:
    met: true
    note: an app package has no chat tool, so it has no routing examples
  privacy_row_per_data_source:
    met: true
    note: "data_sources is empty. The shows are an admin's own feed addresses, listed on the privacy page as platform:podcast-feeds with their hosts"
  offline_behavior_stated:
    met: true
    note: "offline: degraded - episodes saved on the hub play with the internet off; an episode that is not saved plays from the show's website and needs the internet."
  smoke_test:
    met: true
    note: smoke.kind static, the manifest and pages load
  readme_and_changelog:
    met: true
  lint_clean:
    met: true
silver:
  diagnostics_and_reauth:
    met: false
