# Bronze criteria per getmaipai/.github's docs/PACKAGES.md.
package: impression
scale: bronze
bronze:
  tests_green:
    met: true
    note: the smoke fixture passes
  routing_examples:
    met: true
    note: 5 or more examples in manifest.json's routing.examples
  privacy_row_per_data_source:
    met: true
    note: "data_sources is empty. The package makes no outside requests"
  offline_behavior_stated:
    met: true
    note: "offline: full - it needs no internet."
  smoke_test:
    met: true
    note: tests/smoke.json, run through lib/smoke.ts
  readme_and_changelog:
    met: true
  lint_clean:
    met: true
silver:
  diagnostics_and_reauth:
    met: false
