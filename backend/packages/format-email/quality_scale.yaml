package: format-email
scale: bronze
bronze:
  tests_green:
    met: true
    note: "static smoke check (kind: static, lib/smoke.ts) confirms the manifest and SKILL.md both load and parse"
  routing_examples:
    met: true
    note: "formats are chosen through the writing_format tool, not routing (WRITING-FORMATS-01 ruling)"
  privacy_row_per_data_source:
    met: true
    note: a skill has no permissions or host access, so no data source exists to declare
  offline_behavior_stated:
    met: true
    note: "offline: full - plain instructions handed to the model, no network call"
  smoke_test:
    met: true
    note: "kind: static in manifest.json's smoke field"
  readme_and_changelog:
    met: true
  lint_clean:
    met: true
silver:
  diagnostics_and_reauth:
    met: false
    note: no auth or diagnostics apply to a plain-instruction skill
gold:
  real_service_verified:
    met: false
    date: null
    note: no external service to verify against
