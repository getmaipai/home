package: edit_picture
scale: bronze
bronze:
  tests_green:
    met: true
    note: "tests/smoke.json for the recipe line; backend/tests/editPicture.test.ts and mediaOps*.test.ts for the chat turn and the operations"
  routing_examples:
    met: true
    note: 6 examples in manifest.json's routing.examples
  privacy_row_per_data_source:
    met: true
    note: no data source; every picture is changed on this computer and nothing leaves it
  offline_behavior_stated:
    met: true
    note: "offline: full - the picture tools run on this computer"
  smoke_test:
    met: true
    note: "tests/smoke.json, run through lib/smoke.ts"
  readme_and_changelog:
    met: true
  lint_clean:
    met: true
silver:
  diagnostics_and_reauth:
    met: false
    note: no auth to diagnose; a failed edit shows a plain reason on the card
gold:
  real_service_verified:
    met: false
    note: the live edit through chat needs the Stack with the people finder installed
