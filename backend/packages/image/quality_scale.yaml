# Bronze criteria per getmaipai/.github's docs/PACKAGES.md.
package: image
scale: bronze
bronze:
  tests_green:
    met: true
    note: Home's backend/tests/imageApp.test.ts covers the Templates and All images data paths and the Library access rules for an owner, a teen and a child.
  routing_examples:
    met: true
    note: 5 examples in manifest.json's routing.examples
  privacy_row_per_data_source:
    met: true
    note: "data_sources is empty. The app reads only templates and files on the hub, with no outside requests"
  offline_behavior_stated:
    met: true
    note: "offline: degraded - pictures saved on the hub show with the internet off while the hub is reachable."
  smoke_test:
    met: true
    note: smoke.kind static, the manifest and pages load
  readme_and_changelog:
    met: true
  lint_clean:
    met: true
silver:
  diagnostics_and_reauth:
    met: false
