<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News app mockup</title>
<link rel="icon" href="data:,">
<meta name="description" content="Design mockup for the MaiPai Home News app in the media apps' look: Today, My Mix, Following, Saved, Channel, the reader with a Listen dock, a kid-mode variant and a TV layout. Placeholder stories only.">
<style>
/* Layout concept: the media apps mockup's frame, taken as is: a design bar on top, then one app frame that is the hub's shell
   (56 px rail from 640 px, a drawer below it) with the News screens inside. The frame is a CSS container, so the same markup
   draws the phone, desktop and TV layouts. Shell, tokens, bar, rail, tabs, tiles, rows, chips, the docked player, sheets and
   the kid values are copied from docs/design/assets/media-apps-2026-10-17/index.html (hex values from
   commons/ui/src/tokens.css, Home's dark set; the light set is added here, the media mockup is dark only). What is News's own
   is under "News additions": the editorial grid, cards with the text under the picture, the day-grouped headline rows, the
   topic filter, and the reader's reading type. Every deliberate difference is listed in the design note, section 6a.
   Placeholder content only: no real publishers, no family names or addresses; gradients stand in for pictures. */
:root {
  color-scheme: dark;
  --background: #07111f; --cinema: #040a14; --card: #102238; --card-2: #0b1a2c; --foreground: #f4f8ff;
  --muted: #142a43; --muted-foreground: #a9bed7; --border: #294563; --scrim: rgba(4, 10, 20, 0.86);
  --primary: #21a6ff; --primary-foreground: #07111f;
  --hue-violet: #a434ff; --hue-violet-deep: #7a1fd6; --hue-teal: #00e3ae; --hue-orange: #ff8a35; --hue-pink: #ff3e9a;
  --hue-red: #ff4b62; --hue-green: #22c55e; --hue-yellow: #facc15;
  --radius-card: 16px; --radius-control: 10px; --radius-pill: 999px;
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --target: 48px; --fs-body: 16px; --fs-title: 28px; --fs-small: 13px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--cinema); color: var(--foreground); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; stroke: none; }
h1, h2, h3 { text-wrap: balance; }

/* ---------- design bar (outside the app) ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--cinema) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--muted);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.bar .name { font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; margin-right: auto; }
.bar .name .dot { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--primary), var(--hue-violet)); }
.bar .name small { color: var(--muted-foreground); font-weight: 600; }
.seg { display: inline-flex; background: var(--card-2); border: 1px solid var(--muted); border-radius: var(--radius-pill); padding: 3px; gap: 2px; }
.seg button { padding: 6px 12px; border-radius: var(--radius-pill); font-weight: 650; font-size: 13px; color: var(--muted-foreground); min-height: 32px; }
.seg button[aria-pressed="true"] { background: var(--foreground); color: var(--cinema); }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ctl label { font-size: 12px; font-weight: 700; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.06em; }
.ctl select { background: var(--card-2); color: var(--foreground); border: 1px solid var(--muted); border-radius: var(--radius-pill); padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 650; min-height: 34px; max-width: 220px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: var(--radius-pill); background: var(--card-2); border: 1px solid var(--muted); font-size: 13px; font-weight: 650; min-height: 34px; }
.toggle .sw { width: 30px; height: 18px; border-radius: 99px; background: var(--muted); position: relative; transition: background .15s; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted-foreground); transition: transform .15s; }
.toggle[aria-pressed="true"] .sw { background: var(--primary); }
.toggle[aria-pressed="true"] .sw::after { transform: translateX(12px); background: var(--primary-foreground); }
.toggle.kid[aria-pressed="true"] .sw { background: #ffc94d; }
@media (max-width: 700px) {
  .bar { position: static; gap: 8px; padding-block: 8px; }
  .bar .name small { display: none; }
  .ctl { width: 100%; gap: 6px; }
  .ctl select { max-width: none; flex: 1 1 120px; min-width: 0; }
  .seg button { padding: 6px 10px; }
  .bar [data-size="phone"] { display: none; }
  .ctl label { display: none; }
  .caption .tag { display: none; }
  .caption p { font-size: 14px; }
}

/* ---------- try view ---------- */
.try { padding-block: 14px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.caption { max-width: 860px; margin: 0 auto 12px; display: flex; gap: 12px; align-items: flex-start; }
.caption .tag { flex: none; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary-foreground); background: var(--primary); border-radius: var(--radius-pill); padding: 3px 9px; margin-top: 2px; }
.caption p { margin: 0; color: var(--muted-foreground); font-size: 15px; min-width: 0; }
.caption p b { color: var(--foreground); }
.stage { display: flex; justify-content: center; min-width: 0; }
.fitbox { position: relative; flex: none; }
.frame { container: app / inline-size; position: relative; overflow: hidden; background: var(--background); border-radius: 22px; border: 1px solid var(--muted); box-shadow: 0 30px 80px -30px rgba(0,0,0,.8); transform-origin: top left; }
body[data-size="fit"] .try { padding-left: 0; padding-right: 0; padding-top: 0; }
body[data-size="fit"] .caption { padding: 12px max(16px, env(safe-area-inset-left, 0px)) 0; }
body[data-size="fit"] .frame { border-radius: 0; border-left: 0; border-right: 0; }

/* ---------- the app (inside the frame) ---------- */
.app { position: absolute; inset: 0; font-size: var(--fs-body); background: var(--background); font-family: var(--font-sans); --rail-w: 0px; }
.app[data-mode="child"] { --cinema: #141c2b; --background: #1a2333; --card: #26324c; --card-2: #1f2a40; --muted: #2c3a55; --border: #3d4e6e; --muted-foreground: #d3ddeb;
  --primary: #ffc94d; --primary-foreground: #1d1503; --radius-card: 24px; --radius-control: 16px; --target: 76px; --fs-body: 18px; --fs-title: 32px; --fs-small: 15px;
  --font-sans: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif; }
@container app (min-width: 640px) { .app { --rail-w: 56px; } }
.app[data-tv="1"] { --rail-w: 0px; --fs-body: 18px; }
.rail { position: absolute; left: 0; top: 0; bottom: 0; width: 56px; background: var(--cinema); border-right: 1px solid var(--muted); display: none; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; z-index: 20; }
@container app (min-width: 640px) { .rail { display: flex; } }
.app[data-tv="1"] .rail { display: none; }
.rail .brand { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--primary), var(--hue-violet)); margin-bottom: 8px; }
.rail button { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--muted-foreground); position: relative; }
.rail button:hover { background: var(--muted); color: var(--foreground); }
.rail button[aria-current="page"] { background: var(--muted); color: var(--foreground); }
.rail button[aria-current="page"]::before { content: ""; position: absolute; left: -6px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--primary); }
.rail .sep { width: 24px; height: 1px; background: var(--muted); margin: 6px 0; }
.rail .grow { flex: 1; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--primary-foreground); background: var(--hue-teal); }
.app[data-mode="child"] .avatar { background: var(--hue-pink); color: #fff; }

.menubtn { position: absolute; top: 12px; left: 12px; z-index: 25; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--scrim); border: 1px solid var(--muted); backdrop-filter: blur(10px); }
@container app (min-width: 640px) { .menubtn { display: none; } }
.app[data-tv="1"] .menubtn, .app[data-immersive="1"] .menubtn { display: none; }

.scroller { position: absolute; top: 0; bottom: 0; right: 0; left: var(--rail-w); overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
.screen { min-height: 100%; padding-bottom: 24px; }
.screen[hidden] { display: none; }
.pad { padding-left: 16px; padding-right: 16px; }
@container app (min-width: 640px) { .pad { padding-left: 28px; padding-right: 28px; } }
@container app (min-width: 1100px) { .pad { padding-left: 40px; padding-right: 40px; } }

/* app header */
.ahead { display: flex; align-items: center; gap: 8px; padding-top: 14px; min-height: 68px; }
.ahead h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 0 auto 0 52px; }
@container app (min-width: 640px) { .ahead h1 { margin-left: 0; font-size: var(--fs-title); } }
.app[data-tv="1"] .ahead h1 { margin-left: 0; }
.ibtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--foreground); flex: none; }
.ibtn:hover { background: var(--muted); }
.ibtn.solid { background: var(--scrim); border: 1px solid var(--muted); backdrop-filter: blur(8px); }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 12px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; padding: 7px 14px; border-radius: var(--radius-pill); font-weight: 650; font-size: 14px; color: var(--muted-foreground); background: transparent; border: 1px solid var(--muted); min-height: 36px; }
.tab[aria-selected="true"] { background: var(--foreground); color: var(--cinema); border-color: var(--foreground); }
.tabs.under .tab { border: 0; border-radius: 0; padding: 8px 2px; margin-right: 16px; border-bottom: 2px solid transparent; }
.tabs.under .tab[aria-selected="true"] { background: none; color: var(--foreground); border-bottom-color: var(--primary); }

/* banners */
.net { display: none; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-control); padding: 10px 12px; margin-bottom: 14px; font-size: 14px; }
.net svg { color: var(--hue-orange); }
.app[data-net="off"] .net { display: flex; }
.app[data-net="off"] .needs-net { display: none !important; }
.app[data-net="off"] .stream-only { opacity: .55; }

/* artwork: gradients from the hue tokens stand in for pictures */
.art { position: relative; overflow: hidden; background: linear-gradient(160deg, var(--c1), var(--c2)); isolation: isolate; }
.art::before { content: ""; position: absolute; width: 46%; aspect-ratio: 1; border-radius: 50%; left: var(--sx, 62%); top: var(--sy, 14%); background: radial-gradient(circle, color-mix(in srgb, var(--c3, #fff) 70%, transparent), transparent 68%); z-index: -1; }
.art::after { content: ""; position: absolute; inset: auto 0 0 0; height: 46%; background: color-mix(in srgb, var(--cinema) 55%, var(--c2)); clip-path: polygon(0 55%, 18% 30%, 34% 48%, 52% 18%, 70% 44%, 86% 26%, 100% 40%, 100% 100%, 0 100%); z-index: -1; opacity: .85; }
.a0 { --c1: var(--hue-violet); --c2: #0d2a55; --c3: var(--primary); }
.a1 { --c1: var(--hue-teal); --c2: #06345a; --c3: #e8fff9; --sx: 12%; }
.a2 { --c1: var(--hue-orange); --c2: #5a1236; --c3: var(--hue-yellow); --sy: 30%; }
.a3 { --c1: var(--hue-pink); --c2: #2a0f5c; --c3: #ffd1e8; --sx: 20%; }
.a4 { --c1: #1f5488; --c2: #050c18; --c3: #ffb36b; --sx: 70%; --sy: 6%; }
.a5 { --c1: #33d6c2; --c2: #0f4d6b; --c3: var(--hue-yellow); --sx: 8%; --sy: 4%; }
.a6 { --c1: var(--hue-yellow); --c2: #a2440c; --c3: #fff6d6; --sx: 40%; }
.a7 { --c1: var(--primary); --c2: #0a1d3a; --c3: #ffffff; --sx: 74%; --sy: 26%; }
.a8 { --c1: var(--hue-red); --c2: #3b0d4a; --c3: var(--hue-orange); --sx: 30%; --sy: 22%; }
.a9 { --c1: var(--hue-green); --c2: #0b3b3a; --c3: #eaffd6; --sx: 66%; }
.posterart::after { height: 34%; }
/* shelves and tiles */
.shelf-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 22px 0 10px; }
.shelf-h h2 { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
.shelf-h a, .shelf-h .more { color: var(--muted-foreground); font-size: 14px; font-weight: 650; }
.shelf { display: grid; grid-auto-flow: column; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 4px 16px 6px; margin: 0 -16px; grid-auto-columns: 72%; scroll-padding-inline: 16px; }
.shelf::-webkit-scrollbar { display: none; }
.shelf > * { scroll-snap-align: start; }
@container app (min-width: 640px) { .shelf { grid-auto-columns: calc((100% - 36px) / 3.2); margin: 0 -28px; padding: 4px 28px 6px; scroll-padding-inline: 28px; } }
@container app (min-width: 1100px) { .shelf { grid-auto-columns: calc((100% - 48px) / 4.3); margin: 0 -40px; padding: 4px 40px 6px; scroll-padding-inline: 40px; } }
.shelf.posters { grid-auto-columns: 38%; }
@container app (min-width: 640px) { .shelf.posters { grid-auto-columns: calc((100% - 60px) / 5.4); } }
@container app (min-width: 1100px) { .shelf.posters { grid-auto-columns: calc((100% - 84px) / 7.4); } }
.shelf.squares { grid-auto-columns: 44%; }
@container app (min-width: 640px) { .shelf.squares { grid-auto-columns: calc((100% - 48px) / 4.4); } }
@container app (min-width: 1100px) { .shelf.squares { grid-auto-columns: calc((100% - 72px) / 6.4); } }

.tile { text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; border-radius: var(--radius-control); transition: transform .15s ease; }
.tile .art { aspect-ratio: 16 / 9; border-radius: var(--radius-control); width: 100%; }
.tile.poster .art { aspect-ratio: 2 / 3; }
.tile.square .art { aspect-ratio: 1; }
.tile:hover .art { box-shadow: 0 0 0 2px var(--foreground); }
.dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.78); color: #fff; font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.25); }
.prog i { display: block; height: 100%; background: var(--hue-red); }
.app[data-mode="child"] .prog i { background: var(--primary); }
.badge { position: absolute; left: 6px; top: 6px; display: inline-flex; align-items: center; gap: 4px; background: rgba(0,0,0,.72); color: #fff; font-size: 11px; font-weight: 750; padding: 3px 7px 3px 5px; border-radius: 999px; }
.badge svg.i { width: 13px; height: 13px; stroke-width: 2.6; }
.badge.dev { background: var(--primary); color: var(--primary-foreground); }
.badge.new { background: var(--hue-red); color: #fff; padding-left: 7px; }
.tmeta { display: flex; gap: 10px; min-width: 0; }
.chav { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff; }
.ttl { font-weight: 700; font-size: 15px; line-height: 1.3; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sub { color: var(--muted-foreground); font-size: var(--fs-small); margin: 2px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ptitle { position: absolute; inset: auto 8px 10px 8px; font-weight: 900; font-size: clamp(13px, 3.5cqi, 20px); line-height: 1.05; letter-spacing: -0.01em; text-shadow: 0 2px 10px rgba(0,0,0,.5); text-transform: uppercase; }
.tile.poster .ptitle { font-size: 15px; }
.kick { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--target); padding: 0 18px; border-radius: var(--radius-control); font-weight: 750; font-size: 15px; background: var(--muted); color: var(--foreground); }
.btn.primary { background: var(--foreground); color: var(--cinema); }
.btn.accent { background: var(--primary); color: var(--primary-foreground); }
.btn.ghost { background: rgba(255,255,255,.14); backdrop-filter: blur(6px); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: var(--radius-pill); }
/* lists */
.list { display: flex; flex-direction: column; }
.rowi { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--muted); align-items: flex-start; min-width: 0; text-align: left; width: 100%; }
.rowi:last-child { border-bottom: 0; }
.rowi .thumb { width: 132px; flex: none; aspect-ratio: 16/9; border-radius: 8px; }
.rowi .sq { width: 64px; aspect-ratio: 1; border-radius: 10px; flex: none; }
.rowi .body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.rowi .desc { color: var(--muted-foreground); font-size: 14px; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--muted); color: var(--foreground); min-height: 26px; }
.chip svg.i { width: 14px; height: 14px; }
.chip.ok { background: color-mix(in srgb, var(--hue-teal) 18%, transparent); color: #7ff2d3; }
.chip.dev { background: color-mix(in srgb, var(--primary) 20%, transparent); color: #9bd5ff; }
.chip.warn { background: color-mix(in srgb, var(--hue-orange) 18%, transparent); color: #ffc08f; }
.chip.btnlike { background: transparent; border: 1px solid var(--border); }
.pbtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--foreground); color: var(--cinema); flex: none; }
.pbtn svg.i { width: 16px; height: 16px; }
.chanrow { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.chanrow .who { min-width: 0; flex: 1; }
.chanrow .who b { display: block; }
.actrow { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.actrow::-webkit-scrollbar { display: none; }
.actrow .btn { flex: none; }
.panel { background: var(--card-2); border: 1px solid var(--muted); border-radius: var(--radius-card); padding: 12px 14px; margin-top: 14px; }
.panel h3 { margin: 0 0 6px; font-size: 15px; }
/* mini bar */
.mini { position: sticky; bottom: 0; z-index: 15; margin-top: 8px; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--border); display: none; }
.app[data-mini="1"] .mini { display: block; }
.mini .mprog { height: 3px; background: var(--muted); }
.mini .mprog i { display: block; height: 100%; background: var(--primary); }
.mini .in { display: flex; align-items: center; gap: 12px; padding: 8px 12px; }
.mini .mart { width: 46px; height: 46px; border-radius: 8px; flex: none; }
.mini .mt { min-width: 0; flex: 1; text-align: left; }
.mini .mt b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini .mc { display: none; align-items: center; gap: 4px; }
.mini .mcenter { display: flex; align-items: center; gap: 6px; }
.mini .mright { display: none; justify-content: flex-end; }
@container app (min-width: 900px) { .mini .in { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); padding: 10px 24px; } .mini .mc, .mini .mright { display: flex; } .mini .mart { width: 54px; height: 54px; }
  .mini .mcenter .play1 { background: var(--foreground); color: var(--cinema); width: 40px; height: 40px; } }
/* sheet and toast */
.sheet-wrap { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet-wrap[hidden] { display: none; }
.sheet { width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--border); border-radius: 22px 22px 0 0; padding: 10px 16px 18px; max-height: 80%; overflow-y: auto; }
@container app (min-width: 640px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 20px; } }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 0 auto 10px; }
.sheet h3 { margin: 4px 0 4px; font-size: 18px; }
.sheet p { margin: 0 0 8px; color: var(--muted-foreground); font-size: 14px; }

            <div id="screens"></div>
            <div class="mini" id="mini"></div>
          </div>

          <div class="sheet-wrap" id="sheet" hidden></div>

</main>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const ic = (n, cls = "") => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;

  // ---------- placeholder data (made-up outlets and stories; no real publishers) ----------
  const SRC = { "Harbor Courier": ["H", "var(--hue-teal)"], "Space Example": ["S", "var(--hue-violet)"], "Metro Example Times": ["M", "var(--primary)"], "Daily Example": ["D", "var(--hue-orange)"], "Example Wire": ["E", "var(--hue-pink)"], "Science Example": ["S", "var(--hue-green)"], "Greenfield Gazette": ["G", "var(--hue-red)"], "Kitchen Table Weekly": ["K", "var(--hue-orange)"], "Sports Example": ["S", "var(--hue-violet-deep)"], "Kids Example Times": ["K", "var(--hue-yellow)"], "Sprout Science Kids": ["S", "var(--hue-teal)"], "Planet Pals News": ["P", "var(--hue-pink)"] };
  const TOPICS = { world: ["World", "globe"], local: ["Local", "pin"], business: ["Business", "briefcase"], technology: ["Technology", "cpu"], science: ["Science", "flask"], health: ["Health", "heart"], sports: ["Sports", "trophy"], entertainment: ["Entertainment", "film"], environment: ["Environment", "leaf"], kids: ["Kids", "smile"] };
  const T = (id, t, src, topic, ago, a, rd, o = {}) => ({ id, t, src, topic, ago, a, rd, out: 1, dek: "", ...o });
  const ST = [
    T("s1", "Council approves a new harbor path after a three-year debate", "Harbor Courier", "local", "2h", 4, 6, { out: 4, p: .62, dek: "The 1.4 km path along the water opens next summer. The fishing piers stay open while it is built.", day: "m" }),
    T("s2", "Two planets will sit close together in the evening sky this week", "Space Example", "science", "5h", 1, 3, { out: 3, dek: "Look low in the west about forty minutes after sunset.", day: "m" }),
    T("s3", "Grid operator says winter demand could set a new record", "Metro Example Times", "business", "3h", 7, 4, { out: 2, saved: 1, dev: 1, day: "m" }),
    T("s4", "A small clinic's walk-in hours become the model for the whole county", "Daily Example", "health", "4h", 2, 5, { dek: "Shorter waits, fewer emergency visits, and a plan to copy it at four more sites.", day: "m" }),
    T("s5", "The phones that last longest, tested for a full year", "Example Wire", "technology", "6h", 5, 7, { dek: "Battery health, repairs and software support, ranked.", nt: 1, day: "m" }),
    T("s6", "Ocean sensors map a cold current nobody expected", "Science Example", "science", "8h", 9, 5, { saved: 1, day: "m" }),
    T("s7", "School board moves the start time later by twenty minutes", "Harbor Courier", "local", "7h", 3, 3, { day: "m" }),
    T("s8", "Rocket stage test fire moved to Friday", "Space Example", "science", "9h", 8, 2, { day: "m" }),
    T("s9", "Library extends its evening hours through the winter", "Daily Example", "local", "10h", 6, 2, { day: "m" }),
    T("s10", "Wetland restoration brings back a heron colony", "Greenfield Gazette", "environment", "11h", 0, 4, { day: "m" }),
    T("s11", "The farmers market adds a winter Saturday", "Greenfield Gazette", "local", "6h", 6, 2, { read: 1, dek: "Twelve stalls, a soup tent and parking at the old depot.", day: "m" }),
    T("s12", "How a neighborhood bakery doubled its output without a bigger oven", "Kitchen Table Weekly", "business", "7h", 2, 6, { saved: 1, dek: "Shorter proofing, a second shift and a very good spreadsheet.", day: "m" }),
    T("s13", "Playoff preview: three things to watch this weekend", "Sports Example", "sports", "8h", 7, 4, { nt: 1, dek: "A rested defense, a thin bench and a long trip.", day: "m" }),
    T("s14", "Streaming prices: what changed this month", "Example Wire", "entertainment", "9h", 3, 3, { nt: 1, dek: "Two services raised prices, one added a free tier.", day: "m" }),
    T("s15", "Overnight storm clears, roads reopen by noon", "Metro Example Times", "local", "14h", 4, 2, { read: 1, dek: "Crews cleared the last fallen branches before the morning commute.", day: "n" }),
    T("s16", "Why sleep studies are moving into living rooms", "Science Example", "health", "15h", 1, 6, { saved: 1, dev: 1, dek: "Small sensors and a two-night loan replace the overnight clinic stay.", day: "n" }),
    T("s17", "The museum adds free evenings on the first Thursday", "Daily Example", "entertainment", "16h", 5, 2, { nt: 1, dek: "Doors open at five. Tickets are not needed.", day: "n" }),
    T("s18", "Bike lanes, one year in: the numbers", "Metro Example Times", "local", "18h", 9, 5, { nt: 1, dek: "Ridership is up. So is the number of near misses at two crossings.", day: "n" }),
    T("s19", "A new telescope mirror passes its first test", "Space Example", "science", "2d", 5, 4, { dek: "The mirror held its shape to within a few atoms across the whole disc." }),
    T("s20", "Students map the night sky from a school roof", "Science Example", "science", "2d", 0, 3, { dek: "Forty nights, one borrowed camera and a spreadsheet." }),
    T("s21", "Why deep-sea sensors drift, and how teams fix it", "Science Example", "science", "3d", 9, 5, { dek: "Salt, pressure and a patient correction every ten days." }),
  ];
  const KIDS = [
    T("k1", "A baby panda learns to climb", "Kids Example Times", "kids", "1h", 8, 2, { dek: "It took four tries and one very soft landing." }),
    T("k2", "Why the moon looks bigger when it is low in the sky", "Sprout Science Kids", "science", "3h", 1, 3, {}),
    T("k3", "Kids turn an old phone booth into a tiny library", "Planet Pals News", "kids", "5h", 6, 2, {}),
    T("k4", "The tallest sandcastle ever built", "Kids Example Times", "kids", "6h", 2, 2, {}),
    T("k5", "How bees tell each other where the flowers are", "Sprout Science Kids", "science", "1d", 9, 3, { saved: 1 }),
    T("k6", "A school plants a thousand sunflowers", "Planet Pals News", "environment", "1d", 3, 2, { saved: 1 }),
  ];
  const st = (id) => ST.find((s) => s.id === id) || KIDS.find((s) => s.id === id);
  const ids = (a) => a.map(st);
  const KTOP = [["kids", "Kids' news", "smile", "3 stories today"], ["science", "Science", "flask", "2 stories today"], ["environment", "Nature", "leaf", "1 story today"], ["sports", "Sports", "trophy", "1 story today"]];
  const KSRC = ["Kids Example Times", "Sprout Science Kids", "Planet Pals News"];
  const TOPSUB = { world: "9 stories today · from 4 sources", local: "14 stories today · from 3 sources", business: "7 stories today · from 3 sources", technology: "5 stories today · from 2 sources", science: "12 stories today · from 3 sources", health: "6 stories today · from 3 sources", sports: "8 stories today · from 2 sources", entertainment: "6 stories today · from 3 sources", environment: "4 stories today · from 2 sources", kids: "3 stories today · from 3 sources" };
  const CAST = [["phone", "This phone", "Playing"], ["tv", "Living room TV", "MaiPai Go"], ["speaker", "Kitchen speaker", "Robot"], ["hub", "Studio desktop", "Chrome"]];

  // ---------- state ----------
  const S = { screen: "today", kid: false, net: true, size: "fit", tv: false, theme: "dark", topic: "all", sid: "s1", ksid: "k1", hist: [], ftab: "topics", menuId: null,
    follow: { science: 1, local: 1, technology: 0, world: 0, business: 0, health: 0, sports: 0, entertainment: 0, environment: 0, kids: 0, "Space Example": 1, "Harbor Courier": 0, "Daily Example": 0, "Metro Example Times": 0, "Science Example": 1, "Example Wire": 0, "Greenfield Gazette": 0, "Kitchen Table Weekly": 0, "Sports Example": 0, "Kids Example Times": 1, "Sprout Science Kids": 1, "Planet Pals News": 0 },
    listen: { on: false, playing: false, pct: 0.4, rate: 1, sid: "s1" }, tvi: 0, q: "", recents: ["harbor path", "science", "winter demand"], sf: { topic: "all", source: "all", date: "any", saved: false } };
  const SCREENS = [
    ["today", "Today", "Today. One hero over two rows, two featured stories beside it, a shelf from your channels and headline rows by day. <b>Tap a story.</b> Try a topic chip, then <b>Internet off</b>."],
    ["mix", "My Mix", "My Mix: the same layout, ranked from what this person follows and reads on this hub. Each lead says why it is here. Nothing leaves the house."],
    ["following", "Following: Topics", "Following. Topics and Sources are two peer views. <b>Tap Follow</b> to change a row. Tap a row to open its channel."],
    ["followsrc", "Following: Sources", "Sources the home picked, grouped by list. Follow one and its newest story joins the shelf on Today."],
    ["saved", "Saved", "Saved stories keep their text on the hub, so they open with the internet off. The badge says which copies are also on this device."],
    ["channel", "Channel: Science", "A channel is one topic or one source: a header with Follow, then the same hero, featured and rows. Filter by source with the chips."],
    ["story", "Story reader", "The reader. Clean text at 19 px on a comfortable line, Key points written on this hub, Also covering on the side. <b>Tap Listen</b> and the dock appears."],
    ["storylisten", "Story reader: Listen", "Listening. The dock at the bottom is the media apps' docked player: paragraph N of M, play and pause, speed. It stays while you browse."],
    ["search", "Search: results", "News's own search box, scoped to News (stories, topics, sources, Saved), like chat's thread search. Filters: topic, source, date, Saved only. Saved stories come first, then by day. <b>Type to narrow.</b>"],
    ["searchhome", "Search: recent", "An empty search shows the person's recent searches (kept on this hub, only they see them) and topics to try. On TV and for a child there are no recents."],
    ["kidtoday", "Kid: Today", "A kid's Today. Warmer colors, bigger buttons, Kids' sources only. A speaker on each card reads it aloud. <b>Tap the grey tile.</b>"],
    ["kidstory", "Kid: story", "A kid's story. Big type, a read-to-me button, no links out, no Open on site. Key points only appear when they passed the child check."],
  ];
  const IMMERSIVE = new Set(["search", "story", "storylisten", "kidstory", "channel"]);
  const app = $("#app"), scroller = $("#scroller"), screensEl = $("#screens");
  const kidKey = (k) => (k === "today" ? "kidtoday" : k);
  const baseOf = (scr) => ({ search: "today", kidtoday: "today", storylisten: "story", kidstory: "story", followsrc: "following", channel: "following" }[scr] || scr);

  // ---------- pieces ----------
  const netBanner = () => `<div class="net">${ic("wifioff")}<span>The internet is down. Saved stories and stories you opened before are kept on this hub.</span></div>`;
  const hbtn = (icon, label, attrs = "", cls = "") => `<button class="ibtn ${cls}" aria-label="${label}" title="${label}" ${attrs}>${ic(icon)}</button>`;
  const head = (title, sub, actions = "") => `<div class="ahead pad"><div class="ttlblock"><h1>${title}</h1>${sub ? `<p class="dateline">${sub}</p>` : ""}</div>${actions}</div>`;
  const searchbits = () => `<button class="sfield" data-go="search">${ic("search")}<span>Search News</span></button>${hbtn("search", "Search News", 'data-go="search"', "srch")}`;
  function sectionTabs() {
    const names = S.kid ? [["today", "Today"], ["following", "Following"], ["saved", "Saved"]] : [["today", "Today"], ["mix", "My Mix"], ["following", "Following"], ["saved", "Saved"]];
    const cur = baseOf(S.screen);
    return `<div class="tabs" role="tablist">${names.map(([k, n]) => `<button class="tab" role="tab" aria-selected="${cur === k}" data-go="${kidKey(k) === "kidtoday" && S.kid ? "kidtoday" : k}">${n}</button>`).join("")}</div>`;
  }
  const avatar = (src) => { const [l, c] = SRC[src]; return `<span class="chav" style="background:${c};${c.includes("yellow") ? "color:#1d1503" : ""}">${l}</span>`; };
  const savedBadge = (s) => (s.saved ? `<span class="badge">${ic("check")}Saved</span>` : "");
  const picture = (s, extra = "") => `<div class="art a${s.a}">${savedBadge(s)}<span class="dur">${s.rd} min</span>${s.p ? `<span class="prog read"><i style="width:${s.p * 100}%"></i></span>` : ""}${extra}</div>`;
  const kickOf = (s, k) => (k === "hero" && s.out >= 2 ? `Top story · ${s.out} outlets` : `${TOPICS[s.topic][0]}${s.out >= 2 ? ` · ${s.out} outlets` : ""}`);
  function scard(s, kind, why) {
    return `<article class="scard ${kind} ${s.read ? "opened" : ""} ${s.nt ? "stream-only" : ""}"><button class="smain" data-story="${s.id}">${picture(s)}

  function searchFilters() {
    const f = S.sf, tv = S.tv;
    return `<div class="sfchips">${f.topic !== "all" || true ? `<button class="sfchip ${f.topic !== "all" ? "on" : ""}" data-sheet="sf-topic">Topic: ${f.topic === "all" ? "All" : TOPICS[f.topic][0]}${ic("down")}</button>` : ""}<button class="sfchip ${f.source !== "all" ? "on" : ""}" data-sheet="sf-source">Source: ${f.source === "all" ? "All" : f.source}${ic("down")}</button>${S.kid ? "" : `<button class="sfchip ${f.date !== "any" ? "on" : ""}" data-sheet="sf-date">Date: ${SF_DATES[f.date]}${ic("down")}</button>`}${tv ? "" : `<button class="sfchip ${f.saved ? "on" : ""}" data-sfsaved aria-pressed="${f.saved}">${ic("bookmark")}Saved only</button>`}</div>`;
  }
  R.search = () => `<section class="screen"><div class="ahead pad" style="gap:10px"><button class="ibtn" data-back aria-label="Back">${ic("left")}</button><label class="sfield sq">${ic("search")}<input id="sq" type="search" value="${S.q.replace(/"/g, "&quot;")}" placeholder="${S.kid ? "Find a story" : "Search News"}" autocomplete="off" aria-label="Search News"></label></div>
    <div class="pad"><div id="sfilters">${searchFilters()}</div>${netBanner()}<div id="sresults" style="max-width:900px">${searchBody()}</div></div></section>`;

  // ---------- shell ----------
  const APPS = [["home", "Home", "home"], ["chat", "Chat", "chat"], ["news", "News", "news"], ["videos", "Videos", "videos"], ["shows", "Shows and Films", "film"], ["music", "Music", "music"], ["podcasts", "Podcasts", "podcast"], ["books", "Books", "book"]];
  const appList = () => (S.kid ? APPS.filter(([k]) => k !== "podcasts") : APPS);
  function renderRail() {
    $("#rail").innerHTML = `<span class="brand" aria-hidden="true"></span><button aria-label="Search everywhere" title="Search everywhere" data-undrawn="Search">${ic("search")}</button><span class="sep"></span>
      ${appList().map(([k, n, i]) => `<button aria-label="${n}" title="${n}" ${k === "news" ? 'aria-current="page"' : ""} data-app="${k}">${ic(i)}</button>`).join("")}
      <span class="grow"></span><button aria-label="More" title="More" data-undrawn="More">${ic("more")}</button><button aria-label="Profile" title="Profile" data-undrawn="Profile menu"><span class="avatar">${S.kid ? "P" : "N"}</span></button>`;
  }
  function renderDrawer() {
    const secs = S.kid ? [["kidtoday", "Today"], ["following", "Following"], ["saved", "Saved"]] : [["today", "Today"], ["mix", "My Mix"], ["following", "Following"], ["saved", "Saved"]];
    const cur = baseOf(S.screen);
    $("#drawer").innerHTML = `<nav class="drawer" aria-label="Apps"><div class="dhead"><span class="brand" aria-hidden="true"></span>MaiPai Home</div><div class="search">${ic("search")}${S.kid ? "Find something" : "Search everywhere"}</div>
      ${appList().map(([k, n, i]) => `<button class="item" ${k === "news" ? 'aria-current="page"' : ""} data-app="${k}">${ic(i)}${n}</button>`).join("")}
      <div class="lbl">News</div>${secs.map(([k, n]) => `<button class="item secn ${baseOf(k) === cur ? "on" : ""}" data-go="${k}">${n}</button>`).join("")}
      <div class="foot"><span class="avatar">${S.kid ? "P" : "N"}</span><b style="flex:1">${S.kid ? "Pippa" : "Nadia"}</b>${S.kid ? "" : hbtn("sliders", "This app's settings", 'data-undrawn="Settings"')}</div></nav>`;
  }
  const paraText = () => { const n = Math.min(14, Math.floor(S.listen.pct * 14) + 1); return `Paragraph ${n} of 14`; };
  function renderMini() {
    const l = S.listen, show = l.on && !S.tv;
    app.dataset.mini = show ? "1" : "0";
    if (!show) return;
    const s = st(l.sid);
    $("#mini").innerHTML = `<div class="mprog"><i style="width:${l.pct * 100}%"></i></div><div class="in"><button class="mt" style="display:flex;gap:12px;align-items:center;flex:1;min-width:0" data-story="${s.id}"><span class="art a${s.a} mart"></span><span style="min-width:0"><b>${s.t}</b><span class="sub" style="display:block"><span id="mpara">${paraText()}</span> · ${s.src}</span></span></button>
      <div class="mcenter"><span class="mc">${hbtn("prev", "Previous paragraph", 'data-lskip="-1"')}</span><button class="pbtn" data-lplay aria-label="Play or pause">${ic(l.playing ? "pause" : "play", "fill")}</button><span class="mc">${hbtn("next", "Next paragraph", 'data-lskip="1"')}</span><span class="mcl">${hbtn("x", "Stop listening", "data-lclose")}</span></div>
      <div class="mright"><button class="rate" data-lrate aria-label="Reading speed">${l.rate}x</button>${hbtn("cast", "Play on another screen", 'data-sheet="cast"')}${hbtn("x", "Stop listening", "data-lclose")}</div></div>`;
  }
  function render() {
    if (S.kid && !(S.screen === "kidtoday" || S.screen === "kidstory" || S.screen === "following" || S.screen === "saved" || S.screen === "followsrc" || S.screen === "search")) S.screen = "kidtoday";
    if (!S.kid && (S.screen === "kidtoday" || S.screen === "kidstory")) S.screen = "today";
    const key = S.tv && S.screen === "today" ? "tvtoday" : S.screen;
    screensEl.innerHTML = R[key]();
    app.dataset.immersive = IMMERSIVE.has(S.screen) ? "1" : "0";
    app.dataset.mode = S.kid ? "child" : "adult";
    renderRail(); renderMini();
    const mk = S.screen === "search" && !S.q.trim() ? "searchhome" : S.screen;
    const meta = SCREENS.find(([k]) => k === mk) || SCREENS[0];
    $("#captag").textContent = meta[1]; $("#captext").innerHTML = meta[2];
    $("#screenpick").value = SCREENS.some(([k]) => k === mk) ? mk : "today";
    if (S.tv) setTimeout(() => { const f = screensEl.querySelector(".smain, .btn.primary, .rowmain"); f && f.focus({ preventScroll: true }); }, 30);
    if (S.size === "fit" && !$("#try").hidden) layout();
  }
  function go(screen, push = true) {
    if (push && S.screen !== screen) S.hist.push(S.screen);
    S.screen = screen; scroller.scrollTop = 0; closeAll(); render();
  }
  function back() { let p = S.hist.pop(); if (!p || p === S.screen) p = S.kid ? "kidtoday" : "today"; S.screen = p; scroller.scrollTop = 0; render(); }
  let toastT;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2400); }
  function closeAll() { $("#drawer").hidden = true; $("#sheet").hidden = true; }

  const opt = (label, small = "", attrs = "", on = false) => `<button class="opt ${on ? "on" : ""}" ${attrs}>${label}<small>${small}</small></button>`;
  const SHEETS = {
    cast: () => `<h3>Listen on</h3><p>Moves the reading to another speaker or screen. It picks up at the same paragraph.</p>${CAST.map(([i, n, s], k) => `<button class="opt ${k === 0 ? "on" : ""}" data-toast="Now listening on ${n}"><span style="display:flex;gap:10px;align-items:center">${ic(i)}${n}</span><small>${s}</small></button>`).join("")}`,
    "sf-topic": () => `<h3>Topic</h3>${opt("All topics", "", 'data-sfset="topic:all"', S.sf.topic === "all")}${(S.kid ? KTOP.map(([k, n]) => [k, [n]]) : Object.entries(TOPICS).filter(([k]) => k !== "kids")).map(([k, v]) => opt(v[0], "", `data-sfset="topic:${k}"`, S.sf.topic === k)).join("")}`,
    "sf-source": () => `<h3>Source</h3>${opt("All sources", "", 'data-sfset="source:all"', S.sf.source === "all")}${(S.kid ? KSRC : Object.keys(SRC).filter((x) => !KSRC.includes(x))).map((x) => opt(x, "", `data-sfset="source:${x}"`, S.sf.source === x)).join("")}`,
    "sf-date": () => `<h3>Date</h3>${Object.entries(SF_DATES).map(([k, v]) => opt(v, "", `data-sfset="date:${k}"`, S.sf.date === k)).join("")}`,
    resetmix: () => `<h3>Reset My Mix?</h3><p>This forgets what My Mix learned from your reading. What you follow stays. It starts again from what you follow.</p><div class="row-btns"><button class="btn accent" data-toast="My Mix was reset">Reset My Mix</button><button class="btn" data-closesheet>Cancel</button></div>`,
    menu: () => { const s = st(S.menuId); const kid = S.kid; return `<h3 style="font-size:16px">${s.t}</h3><p>${s.src} · ${s.ago}</p>
      ${opt(s.saved ? "Remove from Saved" : "Save", "", 'data-toast="' + (s.saved ? "Removed from Saved" : "Saved. The text is kept on this hub.") + '"')}
      ${opt("Follow " + TOPICS[s.topic][0], "", 'data-toast="Following ' + TOPICS[s.topic][0] + '"')}${opt("Follow " + s.src, "", 'data-toast="Following ' + s.src + '"')}
      ${kid ? "" : opt("Less like this", "My Mix", 'data-toast="Fewer stories like this in My Mix"')}${kid ? "" : opt("Open on site", "needs the internet", 'data-toast="Opens in a new tab, with no referrer"')}
      ${opt("Listen", "", 'data-listen="' + s.id + '"')}`; },
  };
  function sheet(name) { $("#sheet").innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${SHEETS[name]()}</div>`; $("#sheet").hidden = false; }

  // ---------- listening ----------
  function startListen(id) { const l = S.listen; if (l.on && l.sid === id) l.playing = !l.playing; else { Object.assign(l, { on: true, playing: true, sid: id, pct: id === "s3" ? 0.4 : 0.38 }); toast(S.kid ? "Reading it to you" : "Listening in this home's voice"); } closeAll(); render(); }
  setInterval(() => {
    const l = S.listen;
    if (l.on && l.playing) { l.pct = Math.min(1, l.pct + 0.004 * l.rate); if (l.pct >= 1) l.playing = false; const i = $("#mini .mprog i"); if (i) i.style.width = l.pct * 100 + "%"; const p = $("#mpara"); if (p) p.textContent = paraText(); }
    if (S.tv && S.screen === "today") { S.tvtick = (S.tvtick || 0) + 1; if (S.tvtick % 12 === 0) { S.tvi++; render(); } }
  }, 1000);

  // ---------- events ----------
  app.addEventListener("click", (e) => {
    const t = e.target.closest("button, [role=button]"); if (!t) { if (e.target.id === "drawer" || e.target.id === "sheet") closeAll(); return; }
    const d = t.dataset;
    if (t.id === "menubtn") { renderDrawer(); $("#drawer").hidden = false; return; }
    if (d.app) { if (d.app === "news") return go(S.kid ? "kidtoday" : "today"); closeAll(); return toast(`${[...APPS].find(([k]) => k === d.app)[1]} is not part of this mockup`); }
    if (d.go) return go(d.go);
    if (d.back !== undefined) return back();
    if (d.undrawn) { closeAll(); return toast(`${d.undrawn} is not drawn in this mockup`); }
    if (d.closesheet !== undefined) return closeAll();
    if (d.listen) return startListen(d.listen);
    if (d.story) { if (d.resumelisten) { Object.assign(S.listen, { on: true, playing: false, sid: d.story, pct: 0.4 }); } if (S.kid) S.ksid = d.story; else S.sid = d.story; return go(S.kid ? "kidstory" : "story"); }
    if (d.menu) { S.menuId = d.menu; return sheet("menu"); }
    if (d.topic) { S.topic = d.topic; return render(); }
    if (d.ftab) { S.ftab = d.ftab; if (S.screen === "followsrc") S.screen = "following"; return render(); }
    if (d.follow) { S.follow[d.follow] = S.follow[d.follow] ? 0 : 1; toast(S.follow[d.follow] ? "Following. Its newest story joins Today." : "Unfollowed"); return render(); }
    if (d.channel) { return go("channel"); }
    if (d.sfset) { const [k, v] = d.sfset.split(":"); S.sf[k] = v; closeAll(); return render(); }
    if (d.sfsaved !== undefined) { S.sf.saved = !S.sf.saved; return render(); }
    if (d.sqrecent !== undefined) { S.q = S.recents[+d.sqrecent]; return render(); }
    if (d.sqtry) { S.q = d.sqtry; return render(); }
    if (d.sqrm !== undefined) { S.recents.splice(+d.sqrm, 1); return render(); }
    if (d.sqclear !== undefined) { S.recents = []; return render(); }
    if (d.sheet) return sheet(d.sheet);
    if (d.keep !== undefined) return toast("Keeping on this phone");
    if (d.toast) { closeAll(); return toast(d.toast); }
    if (d.lplay !== undefined) { S.listen.playing = !S.listen.playing; return render(); }
    if (d.lskip) { S.listen.pct = Math.max(0, Math.min(0.999, S.listen.pct + (+d.lskip) / 14)); return render(); }
    if (d.lrate !== undefined) { const r = [1, 1.25, 1.5, 0.75]; S.listen.rate = r[(r.indexOf(S.listen.rate) + 1) % r.length]; toast(`Reading speed ${S.listen.rate}x`); return render(); }
    if (d.lclose !== undefined) { S.listen.on = false; S.listen.playing = false; return render(); }
  });
  app.addEventListener("input", (e) => { if (e.target.id !== "sq") return; S.q = e.target.value; $("#sresults").innerHTML = searchBody(); const m = SCREENS.find(([k]) => k === (S.q.trim() ? "search" : "searchhome")); $("#captag").textContent = m[1]; $("#captext").innerHTML = m[2]; });
  app.addEventListener("keydown", (e) => { if (e.target.id === "sq" && e.key === "Enter" && S.q.trim() && !S.kid && !S.tv) { S.recents = [S.q.trim(), ...S.recents.filter((x) => x !== S.q.trim())].slice(0, 5); } });
  // TV: arrow keys move focus by geometry
  app.addEventListener("keydown", (e) => {
    if (!S.tv) return;
    if (e.key === "Escape" || e.key === "Backspace") { e.preventDefault(); return back(); }
    const dirs = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1] }; const dv = dirs[e.key]; if (!dv) return;
    e.preventDefault();
    const cur = document.activeElement; const items = $$("#screens .smain, #screens .btn, #screens .rowmain, #screens .pcard");
    if (!items.length) return; if (!items.includes(cur)) return items[0].focus();
    const a = cur.getBoundingClientRect(); const ax = a.left + a.width / 2, ay = a.top + a.height / 2; let best = null, bs = 1e9;
    for (const el of items) { if (el === cur) continue; const b = el.getBoundingClientRect(); const dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay;
      if (dv[0] && Math.sign(dx) !== dv[0]) continue; if (dv[1] && Math.sign(dy) !== dv[1]) continue;
      const s = dv[0] ? Math.abs(dx) + Math.abs(dy) * 3 : Math.abs(dy) + Math.abs(dx) * 0.6; if (s < bs) { bs = s; best = el; } }
    if (best) { best.focus({ preventScroll: true }); best.scrollIntoView({ block: "nearest", inline: "nearest" }); }
  });

  // ---------- design bar ----------
  const SIZES = { phone: [390, 844], desktop: [1280, 800], tv: [1280, 720] };
  function layout() {
    const frame = $("#frame"), box = $("#fitbox"), stage = $("#stage");
    document.body.dataset.size = S.size;
    if (S.size === "fit") { const top = stage.getBoundingClientRect().top + window.scrollY; frame.style.cssText = `width:100%;height:${Math.max(560, window.innerHeight - Math.min(top, 220))}px`; box.style.cssText = "width:100%"; return; }
    const [w, h] = SIZES[S.size]; const k = Math.min(1, stage.clientWidth / w);
    frame.style.cssText = `width:${w}px;height:${h}px;transform:scale(${k})`; box.style.cssText = `width:${w * k}px;height:${h * k}px`;
  }
  $("#screenpick").innerHTML = SCREENS.map(([k, n]) => `<option value="${k}">${n}</option>`).join("");
  function setKid(on) { S.kid = on; $("#kidtoggle").setAttribute("aria-pressed", on); }
  function pickScreen(v) { if (v === "searchhome") { S.q = ""; S.sf = { topic: "all", source: "all", date: "any", saved: false }; v = "search"; } else if (v === "search") { S.q = "path"; } setKid(v.startsWith("kid")); if (v === "storylisten") Object.assign(S.listen, { on: true, playing: true, sid: "s1", pct: 0.4 }); if (v === "story") S.sid = "s1"; if (v === "followsrc") S.ftab = "sources"; if (v === "following") S.ftab = "topics"; S.hist = []; go(v === "storylisten" ? "story" : v, false); }
  $("#screenpick").addEventListener("change", (e) => pickScreen(e.target.value));
  $("#kidtoggle").addEventListener("click", () => { setKid(!S.kid); S.hist = []; go(S.kid ? "kidtoday" : "today", false); });
  $("#nettoggle").addEventListener("click", () => { S.net = !S.net; $("#nettoggle").setAttribute("aria-pressed", !S.net); app.dataset.net = S.net ? "on" : "off"; render(); });
  function setTheme(th) { S.theme = th; document.documentElement.dataset.theme = th; $("#themetoggle").setAttribute("aria-pressed", th === "light"); }
  $("#themetoggle").addEventListener("click", () => setTheme(S.theme === "light" ? "dark" : "light"));
  $$(".bar [data-size]").forEach((b) => b.addEventListener("click", () => { S.size = b.dataset.size; S.tv = S.size === "tv"; app.dataset.tv = S.tv ? "1" : "0"; $$(".bar [data-size]").forEach((x) => x.setAttribute("aria-pressed", x === b)); layout(); render(); }));
  window.addEventListener("resize", layout);
  // a bare #token picks a screen, a size, or the light theme (artifact links allow only plain anchors)
  const h = location.hash.slice(1);
  if (h === "searchhome" || h === "search") { S.screen = "search"; S.q = h === "search" ? "path" : ""; } else if (h === "light") setTheme("light");
  else if (SCREENS.some(([k]) => k === h)) { setKid(h.startsWith("kid")); if (h === "storylisten") { Object.assign(S.listen, { on: true, playing: true, sid: "s1", pct: 0.4 }); S.screen = "story"; } else S.screen = h; if (h === "followsrc") S.ftab = "sources"; }
  if (h === "phone" || h === "desktop" || h === "tv") $(`.bar [data-size="${h}"]`).click();
  layout(); render();
  window.__np = { go, S, setKid, layout, render, setTheme, pickScreen };
})();
</script>
</body>
</html>
