<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videos Create, two-pane workspace (mockup, 2026-11-02)</title>
<!-- Design mockup for docs/design/video-create-one-page-2026-11-02.md. Not product code.
     Query: ?theme=light|dark  &page=create|clips  &state=done|draft|rendering|empty  &open=style|sheet
     Tokens are the kit's (commons ui/src/tokens.css). Loops are the package's own backend/packages/videos/assets/loops. Demo data only. -->
<style>
:root{--bg:#f4f7fb;--fg:#0b1730;--card:#fff;--border:#c9d6e6;--muted:#e3eaf3;--mfg:#4a5f7a;--primary:#21a6ff;--pfg:#07111f;--shadow:0 8px 30px rgba(11,23,48,.12);--stage:#0b1730}
:root[data-theme=dark]{--bg:#07111f;--fg:#f4f8ff;--card:#102238;--border:#294563;--muted:#142a43;--mfg:#a9bed7;--shadow:0 8px 30px rgba(0,0,0,.45);--stage:#030912}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:13.5px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;height:100vh;overflow:hidden}
.rail{width:56px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0}
.rail i{width:28px;height:28px;border-radius:8px;background:var(--muted);display:block}
.rail i.on{background:var(--primary)}
.side{width:190px;flex:none;border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:8px}
.modes{display:flex;background:var(--muted);border-radius:999px;padding:3px;margin-bottom:6px}
.modes span{flex:1;text-align:center;padding:6px 0;border-radius:999px;color:var(--mfg)}
.modes span.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.nav{padding:9px 12px;border-radius:10px;display:flex;justify-content:space-between}
.nav.on{background:var(--muted);font-weight:600}
.nav small{color:var(--mfg)}
.nav.later{color:var(--mfg);opacity:.6}
.sidelabel{margin:10px 12px 0;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mfg)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.head{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px}
.head h1{font-size:18px;margin:0;font-weight:600;flex:1}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#21a6ff,#8b7bff)}
.work{flex:1;min-height:0;display:flex;gap:14px;padding:0 14px 14px}
.panel{width:372px;flex:none;background:var(--card);border:1px solid var(--border);border-radius:18px;display:flex;flex-direction:column;position:relative}
.panel .body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel .foot{padding:12px 14px;border-top:1px solid var(--border)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px;min-height:40px}
.seg span{display:flex;align-items:center;padding:0 12px;border-radius:999px;color:var(--mfg)}
.seg span.on{background:var(--primary);color:var(--pfg);font-weight:600}
.seg.full{display:flex}.seg.full span{flex:1;justify-content:center}
.lab{font-size:12px;font-weight:600;color:var(--mfg);margin-bottom:6px;display:block}
.pbox{border:1px solid var(--border);border-radius:14px;background:var(--bg);padding:10px}
.attach{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;margin-bottom:8px}
.attach video{width:56px;height:38px;object-fit:cover;border-radius:6px}
.attach .nm{flex:1;min-width:0}.attach .nm small{display:block;color:var(--mfg)}
.field{min-height:110px;border:0;background:transparent;color:var(--fg);font:inherit;font-size:14px;resize:none;outline:none;width:100%}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{padding:3px 10px;border-radius:999px;background:var(--muted);color:var(--mfg);font-size:12px}
.sugg .tag{background:transparent;border:1px solid var(--border);padding:4px 10px}
.refs{display:flex;gap:8px}
.slot{width:64px;height:64px;border-radius:10px;border:2px dashed var(--border);color:var(--mfg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;background:transparent;padding:0;line-height:1.15;text-align:center}
.slot.f{border:1px solid var(--border);overflow:hidden;position:relative}
.slot.f video{width:100%;height:100%;object-fit:cover}
.slot.ann{opacity:.55}
.pill{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--border);background:var(--card);width:100%}
.pill .mini{display:flex;margin-right:6px}
.pill .mini video{width:32px;height:32px;border-radius:7px;object-fit:cover;margin-right:-8px;border:2px solid var(--card)}
.two{display:flex;gap:8px}.two>*{flex:1}
.more{display:flex;justify-content:space-between;color:var(--mfg);padding:2px 2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-weight:500}
.btn.p{background:var(--primary);color:var(--pfg);border-color:transparent;font-weight:600}
.gen{width:100%;min-height:52px;font-size:15px;flex-direction:column;gap:0;line-height:1.15}
.gen small{font-weight:400;font-size:11px}
.feedwrap{flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:18px;display:flex;flex-direction:column;min-height:0}
.filters{display:flex;gap:16px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);color:var(--fg);flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px}.chk i{width:16px;height:16px;border:1.5px solid var(--mfg);border-radius:4px;display:block}
.feed{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:26px}
.entry .txt{font-size:14px;margin:0 0 8px;max-width:720px}
.entry .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.entry .ref{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 3px;border-radius:999px;background:var(--muted);color:var(--mfg);font-size:12px}
.entry .ref video{width:22px;height:22px;border-radius:50%;object-fit:cover}
.stage{position:relative;aspect-ratio:16/9;width:min(100%,560px);border-radius:14px;overflow:hidden;background:var(--stage);color:#fff;display:flex;align-items:center;justify-content:center}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .blur{position:absolute;inset:0;filter:blur(18px);transform:scale(1.15)}
.stage .blur video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .scrim{position:absolute;inset:0;background:rgba(3,9,18,.45)}
.stage .face{position:relative;text-align:center;padding:14px}
.stage .face h2{margin:0 0 4px;font-size:16px}.stage .face p{margin:0 0 10px;opacity:.85}
.stage .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.prog{width:min(300px,80%);height:6px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 10px;overflow:hidden}.prog b{display:block;height:100%;width:42%;background:var(--primary)}
.controls{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:8px 12px;color:#fff;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent)}
.controls .bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}.controls .bar b{display:block;width:34%;height:100%;border-radius:2px;background:var(--primary)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.ico{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:16px}
.acts .sp{flex:1}
.pop{position:absolute;left:calc(100% + 12px);top:150px;width:560px;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:14px;z-index:5}
.pop h4,.sheet h4{margin:0 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mfg);font-weight:600}
.pop section{margin-bottom:14px}.pop section:last-child{margin-bottom:0}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{display:flex;flex-direction:column;gap:4px;font-size:12px;text-align:center}
.card .th{aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--stage);outline:2px solid transparent;outline-offset:1px}
.card.on .th{outline-color:var(--primary)}.card.on{font-weight:600}
.card video{width:100%;height:100%;object-fit:cover;display:block}
.sheetback{position:fixed;inset:0;background:rgba(3,9,18,.55);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 16px 18px;z-index:21;display:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 12px}
.sheet h4{margin:14px 0 8px}
.dock{display:none}
/* library page */
.lib{flex:1;min-width:0;overflow:auto;padding:0 20px 20px}
.libbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.tabs{display:flex;gap:4px;background:var(--muted);border-radius:999px;padding:3px}
.tabs span{padding:6px 16px;border-radius:999px;color:var(--mfg)}.tabs span.on{background:var(--card);color:var(--fg);font-weight:600}
.slider{display:flex;align-items:center;gap:8px;color:var(--mfg)}.slider b{width:120px;height:4px;border-radius:2px;background:var(--border);position:relative;display:block}.slider b:after{content:"";position:absolute;left:55%;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--primary)}
.day{display:flex;align-items:center;gap:10px;margin:18px 0 10px}.day h3{margin:0;font-size:16px}.day span{color:var(--mfg)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tile .th{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--stage)}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px}
.tile .fav{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px}
.tile .t{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}.tile .s{color:var(--mfg);font-size:12px}
.menu{display:none}
.hmodes{width:170px;margin:0}
.srch{padding:7px 14px;border:1px solid var(--border);border-radius:999px;color:var(--mfg);background:var(--card)}
@media (max-width:1023px){.hmodes,.srch{display:none}}
@media (max-width:1023px){.side{display:none}}
@media (max-width:1023px){
 .panel{display:none}
 .work{padding:0 12px 0}
 .feedwrap{border-radius:14px 14px 0 0}
 .dock{display:flex}
 .grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:639px){
 .rail{display:none}
 .head{padding:0 16px 0 60px}
 .menu{display:block;position:fixed;left:12px;top:10px;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--border);z-index:3}
 .feed{padding:12px 14px;gap:22px}
 .filters{overflow-x:auto;flex-wrap:nowrap;white-space:nowrap;padding:10px 14px}
 .acts{flex-wrap:nowrap;overflow-x:auto}
 .lib{padding:0 14px 14px}
}
.dockbar{position:fixed;left:10px;right:10px;bottom:10px;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:8px 8px 8px 14px;align-items:center;gap:8px;z-index:4}
.dockbar .f{flex:1;color:var(--mfg);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.round.p{background:var(--primary);color:var(--pfg);border-color:transparent;font-weight:700}
</style>
</head>
<body>
<script>
const q=new URLSearchParams(location.search);
const theme=q.get('theme')||'light';document.documentElement.dataset.theme=theme;
const state=q.get('state')||'done',open=q.get('open')||'',pg=q.get('page')||'create';
const L='../../../../backend/packages/videos/assets/loops/';
const clip=n=>`<video muted loop playsinline autoplay preload="auto" src="${L}${n}.mp4#t=0.4"></video>`;
const looks=[['natural','Natural'],['classic-cartoon','Classic cartoon'],['anime','Anime'],['3d-animated','3D animated'],['film','Film']];
const cams=[['still','Still'],['dolly-in','Dolly in'],['slow-orbit','Orbit'],['handheld','Handheld'],['slow-motion','Slow motion'],['time-lapse','Time-lapse'],['aerial','Aerial'],['close-up','Close-up']];
const cardsHtml=(a,sel)=>a.map(([v,l])=>`<div class="card ${v===sel?'on':''}"><div class="th">${clip(v)}</div>${l}</div>`).join('');
const popHtml=`<section><h4>Look</h4><div class="cards" style="grid-template-columns:repeat(5,1fr)">${cardsHtml(looks,'anime')}</div></section><section><h4>Camera</h4><div class="cards">${cardsHtml(cams,'dolly-in')}</div></section><section><h4>Sound</h4><span class="seg"><span class="on">Keep it clean</span><span>Music and effects</span></span></section>`;
const level=`<span class="seg full"><span>Standard</span><span class="on">Boost</span><span>Max</span></span>`;
const words='A paper boat floats down a rainy street at dusk, a girl in a yellow coat follows it, "Wait for me!"';
const attach=`<div class="attach">${clip('film')}<div class="nm">street-photo.jpg<small>Start frame</small></div><span class="tag">x</span></div>`;
const panel=`<aside class="panel" aria-label="Make a video"><div class="body">
 <div class="pbox">${state==='empty'?'':attach}<textarea class="field" aria-label="Describe a video" placeholder="Describe your video. Put each person's line in quotes.">${state==='empty'?'':words}</textarea>${state==='empty'?'<div class="sugg"><span class="tag">A paper boat in the rain</span><span class="tag">Sunrise over a valley</span><span class="tag">A cozy cabin in the snow</span></div>':''}</div>
 <div><span class="lab">References</span><div class="refs"><button class="slot f">${clip('film')}</button><button class="slot"><b>+</b>End frame</button><button class="slot ann"><b>+</b>Voice clip</button></div></div>
 <div><span class="lab">Style</span><span class="pill"><span style="display:flex;align-items:center"><span class="mini">${clip('anime')}${clip('dolly-in')}</span>Anime, Dolly in</span>&#9662;</span></div>
 <div><span class="lab">Level</span>${level}</div>
 <div class="two"><div><span class="lab">Shape</span><span class="seg full"><span class="on">16:9</span><span>9:16</span></span></div><div><span class="lab">Length</span><span class="seg full"><span class="on">5 s</span><span>10 s</span></span></div></div>
 <div class="more"><span>More settings</span><span>&#9662;</span></div>
 </div><div class="foot"><button class="btn p gen">Generate<small>Boost, 5 s, about a minute</small></button></div>${open==='style'?`<div class="pop">${popHtml}</div>`:''}</aside>`;
const acts=`<div class="acts"><span class="ico" title="Remix">&#9998;</span><span class="ico" title="Another take">&#8635;</span><span class="ico" title="Make it Max">HD</span><span class="ico" title="Download">&#8681;</span><span class="ico" title="More">&#8943;</span><span class="sp"></span><span class="ico" title="Favorite">&#9825;</span></div>`;
const tags=(x=[])=>`<div class="tags"><span class="ref">${clip('film')}Start frame</span><span class="tag">Anime</span><span class="tag">Dolly in</span><span class="tag">Boost</span><span class="tag">5 s</span><span class="tag">With sound</span></div>`;
const first={
 done:`<div class="stage">${clip('anime')}<div class="controls"><span>0:02</span><div class="bar"><b></b></div><span>0:05</span></div></div>${acts}`,
 rendering:`<div class="stage"><div class="blur">${clip('anime')}</div><div class="scrim"></div><div class="face"><div class="prog"><b></b></div><h2>Making your video, 42% done</h2><p>About a minute left. You can leave this page.</p><button class="btn">Cancel</button></div></div>`,
 draft:`<div class="stage">${clip('anime')}<div class="controls" style="justify-content:center">First picture, not yet a video</div></div><div class="acts"><button class="btn p">Make the video from this</button><button class="btn">Another still</button><button class="btn">Edit words</button></div>`,
 empty:''}[state];
const older=[['aerial','Sunrise over a valley, birds crossing the sky','Standard, 10 s'],['3d-animated','A robot waters a garden at sunrise','Max, 10 s'],['handheld','Birthday candles being blown out','Standard, 5 s']];
const entry=(t,tg,body)=>`<article class="entry"><p class="txt">${t}</p>${tg}${body}</article>`;
const feedHtml=state==='empty'?`<div style="margin:auto;text-align:center;color:var(--mfg)"><h2 style="color:var(--fg);margin:0 0 6px">Your clips show here</h2>Describe a video on the left and press Generate. Each clip stays in this feed, newest first.</div>`:
 entry(words,tags(),first)+older.map(([c,t,s])=>entry(t,`<div class="tags"><span class="tag">${s}</span><span class="tag">Natural</span></div>`,`<div class="stage">${clip(c)}<div class="controls"><span>0:00</span><div class="bar"><b style="width:0"></b></div><span>0:05</span></div></div>${acts}`)).join('');
const filters=`<div class="filters"><span class="chk"><i></i>Favorites only</span><span class="chk"><i></i>Group by words</span><span>Type: All &#9662;</span></div>`;
const sidebar=on=>`<aside class="side"><div class="nav ${on==='create'?'on':''}">Create</div><div class="nav ${on==='clips'?'on':''}">My clips</div><div class="sidelabel">Later</div><div class="nav later">Characters</div><div class="nav later">Shows</div></aside>`;
const dock=`<div class="dock dockbar"><span class="f">${state==='empty'?'Describe your video':words}</span><button class="round" aria-label="Options">&#9776;</button><button class="round p" aria-label="Generate">&#10148;</button></div>`;
const sheet=`<div class="sheetback" style="${open==='sheet'?'display:block':''}"></div><div class="sheet" style="${open==='sheet'?'display:block':''}"><div class="grab"></div><h4>References</h4><div class="refs"><button class="slot f">${clip('film')}</button><button class="slot"><b>+</b>End frame</button><button class="slot ann"><b>+</b>Voice clip</button></div><h4>Level</h4>${level}<h4>Shape and length</h4><div class="two"><span class="seg full"><span class="on">16:9</span><span>9:16</span></span><span class="seg full"><span class="on">5 s</span><span>10 s</span></span></div><h4>Look</h4><div class="cards" style="grid-template-columns:repeat(3,1fr)">${cardsHtml(looks,'anime')}</div><h4>Camera</h4><div class="cards" style="grid-template-columns:repeat(3,1fr)">${cardsHtml(cams,'dolly-in')}</div><div style="position:sticky;bottom:-18px;background:var(--card);padding:10px 0 4px;border-top:1px solid var(--border);margin-top:14px"><button class="btn p gen">Generate<small>Boost, 5 s, about a minute</small></button></div></div>`;
const tiles=[['anime','A paper boat in the rain','Boost, 5 s','0:05',1],['aerial','Sunrise over a valley','Standard, 10 s','0:10',0],['3d-animated','A robot waters a garden','Max, 10 s','0:10',1],['film','A cozy cabin in the snow','Standard, 5 s','0:05',0],['handheld','Birthday candles','Standard, 5 s','0:05',0],['time-lapse','Clouds over the harbor','Boost, 5 s','0:05',1],['classic-cartoon','A dog chases a kite','Standard, 5 s','0:05',0],['slow-orbit','Teapot on a windowsill','Boost, 5 s','0:05',0],['close-up','A cat watches rain','Standard, 5 s','0:05',0],['slow-motion','A drop hits a puddle','Boost, 5 s','0:05',0]];
const tile=([c,t,s,d,f])=>`<div class="tile"><div class="th">${clip(c)}${f?'<span class="fav">&#9829;</span>':''}<span class="dur">${d}</span></div><div class="t">${t}</div><div class="s">${s}</div></div>`;
const libHtml=`<div class="lib"><div class="libbar"><div class="tabs"><span class="on">All</span><span>Favorites</span><span>Uploaded</span></div><span style="flex:1"></span><span class="slider">Size <b></b></span><button class="btn">Filter</button><button class="btn">Select all</button></div>
<div class="day"><h3>Today</h3><span>5 clips</span></div><div class="grid">${tiles.slice(0,5).map(tile).join('')}</div>
<div class="day"><h3>Yesterday</h3><span>5 clips</span></div><div class="grid">${tiles.slice(5).map(tile).join('')}</div></div>`;
const body=pg==='clips'?`${sidebar('clips')}<div class="main"><button class="menu" aria-label="Menu"></button><header class="head"><h1>My clips</h1><div class="modes hmodes"><span>Browse</span><span class="on">Create</span></div><span class="srch">Search Videos</span><div class="avatar"></div></header>${libHtml}</div>`:
`${sidebar('create')}<div class="main"><button class="menu" aria-label="Menu"></button><header class="head"><h1>Create</h1><div class="modes hmodes"><span>Browse</span><span class="on">Create</span></div><span class="srch">Search Videos</span><div class="avatar"></div></header><div class="work">${panel}<section class="feedwrap">${filters}<div class="feed">${feedHtml}</div></section></div></div>`;
document.body.innerHTML=`<div class="app"><nav class="rail"><i></i><i></i><i class="on"></i><i></i></nav>${body}</div>${pg==='create'?dock+sheet:''}`;
</script>
</body>
</html>
