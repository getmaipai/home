[project]
name = "maipai-spec"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.76.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Explicit per-file `pytestmark = pytest.mark.asyncio` (.github/CLAUDE.md's
# own documented convention), not asyncio_mode = "auto": a forgotten
# marker under "auto" mode silently runs a coroutine test as a no-op
# (it returns an un-awaited coroutine, never actually executing the test
# body) rather than failing loudly.
asyncio_mode = "strict"

[tool.ruff]
target-version = "py312"
extend-exclude = ["gen/py"]
